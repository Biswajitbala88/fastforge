$kind: http-request
description: ""
url: "{{baseUrl}}/users/me"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "John Updated"
    }
auth:
  type: bearer
  credentials:
    token: "{{userToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      pm.test("Name changed", () => pm.expect(pm.response.json().name).to.eql("John Updated"));
    language: text/javascript
order: 2000
