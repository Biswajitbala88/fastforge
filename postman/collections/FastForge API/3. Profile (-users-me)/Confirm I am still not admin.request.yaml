$kind: http-request
description: ""
url: "{{baseUrl}}/users/me"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{userToken}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      const u = pm.response.json();
      pm.test("Still unprivileged", () => {
        pm.expect(u.is_admin).to.eql(false);
        pm.expect(u.role).to.eql("user");
      });
    language: text/javascript
order: 7000
