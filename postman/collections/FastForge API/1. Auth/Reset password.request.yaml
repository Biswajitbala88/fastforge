$kind: http-request
description: Sets a new password using `resetToken`.
url: "{{baseUrl}}/auth/reset-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "token": "{{resetToken}}",
      "new_password": "{{newPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 8000
