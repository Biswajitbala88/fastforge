$kind: http-request
description: Requests a reset link for `userEmail`. With `DEBUG=true` the response includes `reset_token`, which is saved as `resetToken`; otherwise copy the token from the reset link in the server log.
url: "{{baseUrl}}/auth/forgot-password"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "email": "{{userEmail}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200", () => pm.response.to.have.status(200));
      const body = pm.response.json();
      if (body.reset_token) {
        pm.collectionVariables.set("resetToken", body.reset_token);
      }
    language: text/javascript
order: 7000
