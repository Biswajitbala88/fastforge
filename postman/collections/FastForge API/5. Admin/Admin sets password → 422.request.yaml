$kind: http-request
description: "`password` is not an admin-editable field, so even an admin gets 422."
url: "{{baseUrl}}/users/{{userId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "password": "hunter2000"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.collectionVariables.get("adminToken")) {
        console.warn("No adminToken: run 'Login as admin' first (see collection description).");
      }
    language: text/javascript
  - type: afterResponse
    code: pm.test("Status is 422", () => pm.response.to.have.status(422));
    language: text/javascript
order: 5000
