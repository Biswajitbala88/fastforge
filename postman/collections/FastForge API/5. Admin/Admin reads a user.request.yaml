$kind: http-request
description: ""
url: "{{baseUrl}}/users/{{userId}}"
method: GET
auth:
  type: bearer
  credentials:
    token: "{{adminToken}}"
scripts:
  - type: beforeRequest
    code: |-
      if (!pm.collectionVariables.get("adminToken")) {
        console.warn("No adminToken: run 'Login as admin' first (see collection description).");
      }
    language: text/javascript
  - type: afterResponse
    code: pm.test("Status is 200", () => pm.response.to.have.status(200));
    language: text/javascript
order: 3000
