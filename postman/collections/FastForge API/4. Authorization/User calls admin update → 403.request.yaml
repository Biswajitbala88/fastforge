$kind: http-request
description: ""
url: "{{baseUrl}}/users/{{userId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "is_admin": true
    }
auth:
  type: bearer
  credentials:
    token: "{{userToken}}"
scripts:
  - type: afterResponse
    code: pm.test("Status is 403", () => pm.response.to.have.status(403));
    language: text/javascript
order: 4000
