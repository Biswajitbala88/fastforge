$kind: http-request
description: Sends `hacker` in the signup body. Must be rejected with 422.
url: "{{baseUrl}}/auth/signup"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "name": "John Doe",
      "email": "{{$randomEmail}}",
      "password": "{{password}}",
      "hacker": "yes"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: pm.test("Status is 422", () => pm.response.to.have.status(422));
    language: text/javascript
order: 5000
